name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: nix eval (all configs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # eval every machine + home build derivation.
      - name: nix eval all checks
        run: |
          nix eval --no-eval-cache --raw '.#checks' --apply '
            checks:
              builtins.concatStringsSep "\n" (
                builtins.concatMap (system:
                  map (drv: drv.drvPath) (builtins.attrValues checks.${system})
                ) (builtins.attrNames checks)
              )
          '

  format:
    name: treefmt (formatting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: check formatting
        run: nix fmt -- --ci
