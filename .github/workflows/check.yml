name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: nix eval (all configs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # eval every machine + home build derivation.
      - name: nix eval all checks
        run: |
          nix eval --no-eval-cache --raw '.#checks' --apply '
            checks:
              builtins.concatStringsSep "\n" (
                builtins.concatMap (system:
                  map (drv: drv.drvPath) (builtins.attrValues checks.${system})
                ) (builtins.attrNames checks)
              )
          '

  format:
    name: treefmt (formatting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: check formatting
        run: nix fmt -- --ci
